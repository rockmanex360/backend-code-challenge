services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?set MSSQL_SA_PASSWORD in .env}
    ports:
      - "1433:1433"
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -b -Q \"SELECT 1\" -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  db-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    depends_on:
      db:
        condition: service_healthy
    environment:
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
    volumes:
      - ./database:/scripts:ro
    entrypoint:
      - /bin/bash
      - -c
      - |
        set -euo pipefail
        shopt -s nullglob
        sql() { /opt/mssql-tools18/bin/sqlcmd -S db -U sa -P "$$MSSQL_SA_PASSWORD" -C -b -I "$$@"; }
        sql -Q "IF DB_ID('ShipManagement') IS NULL CREATE DATABASE ShipManagement;"
        for f in /scripts/*.sql; do echo "Running $$f"; sql -d ShipManagement -i "$$f"; done
        echo "Database ready"

  api:
    build: .
    depends_on:
      db-init:
        condition: service_completed_successfully
    environment:
      ConnectionStrings__Default: "Server=db;Database=ShipManagement;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True"
      Auth__ApiKey: ${AUTH_API_KEY:?set AUTH_API_KEY in .env}
    ports:
      - "8080:8080"